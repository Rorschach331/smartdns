name: Custom Build with WebUI

on:
  workflow_dispatch:
    inputs:
      ui_repo:
        description: "WebUI Repository (e.g., your-username/smartdns-webui)"
        required: true
        default: "Rorschach331/smartdns-webui"
      ui_branch:
        description: "WebUI Branch"
        required: true
        default: "main"
      arch:
        description: "Architecture (e.g., x86-64, arm64, armhf, mips)"
        required: true
        default: "x86-64"
      platform:
        description: "Platform (linux, openwrt, debian, luci)"
        required: true
        default: "linux"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SmartDNS
        uses: actions/checkout@v4

      - name: Checkout Custom WebUI
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.ui_repo }}
          ref: ${{ github.event.inputs.ui_branch }}
          path: smartdns-webui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y binutils perl curl make gcc clang wget unzip ca-certificates

      - name: Build Package
        run: |
          # The build-pkg.sh will find our local smartdns-webui folder
          sh ./package/build-pkg.sh --platform ${{ github.event.inputs.platform }} --arch ${{ github.event.inputs.arch }} --with-ui --static

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartdns-custom-${{ github.event.inputs.platform }}-${{ github.event.inputs.arch }}
          path: |
            package/*.tar.gz
            package/*.deb
            package/*.ipk
