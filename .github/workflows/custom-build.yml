name: Custom Build with WebUI

on:
  workflow_dispatch:
    inputs:
      ui_repo:
        description: "WebUI Repository (e.g., your-username/smartdns-webui)"
        required: true
        default: "Rorschach331/smartdns-webui"
      ui_branch:
        description: "WebUI Branch"
        required: true
        default: "main"
      arch:
        description: "Architecture (e.g., x86-64, arm64, armhf, mips)"
        required: true
        default: "x86-64"
      platform:
        description: "Platform (linux, openwrt, debian, luci, optware, redhat, windows)"
        required: true
        default: "linux"
      publish_release:
        description: "Publish to GitHub Release"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout SmartDNS
        uses: actions/checkout@v4

      - name: Checkout Custom WebUI
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.ui_repo }}
          ref: ${{ github.event.inputs.ui_branch }}
          path: smartdns-webui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y binutils perl curl make gcc clang wget unzip ca-certificates

          # 自动识别并配置所需的交叉编译源与工具链
          ARCH="${{ github.event.inputs.arch }}"
          CROSS_TOOL=""
          if [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "armhf" ] || [ "$ARCH" = "arm" ] || [ "$ARCH" = "armel" ]; then
            echo "Configuring multi-arch APT sources to prevent 404..."
            # 限制原主源仅服务于 amd64 架构
            if [ -f /etc/apt/sources.list ]; then
              sudo sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
              sudo sed -i 's/deb mirror/deb [arch=amd64] mirror/g' /etc/apt/sources.list
            fi
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i '/Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
            fi
            
            # 添加适用于其它架构的 ports 归档源
            CODENAME=$(lsb_release -sc)
            sudo tee /etc/apt/sources.list.d/ports.list <<EOF
deb [arch=arm64,armhf,armel] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME} main restricted universe multiverse
deb [arch=arm64,armhf,armel] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME}-updates main restricted universe multiverse
deb [arch=arm64,armhf,armel] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME}-security main restricted universe multiverse
EOF
          fi

          if [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
            echo "Installing ARM64 cross-compiler and dependencies..."
            sudo dpkg --add-architecture arm64
            sudo apt update
            sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libssl-dev:arm64
            CROSS_TOOL="aarch64-linux-gnu-"
          elif [ "$ARCH" = "armhf" ]; then
            echo "Installing ARMHF cross-compiler and dependencies..."
            sudo dpkg --add-architecture armhf
            sudo apt update
            sudo apt install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libssl-dev:armhf
            CROSS_TOOL="arm-linux-gnueabihf-"
          elif [ "$ARCH" = "arm" ] || [ "$ARCH" = "armel" ]; then
            echo "Installing ARM cross-compiler and dependencies..."
            sudo dpkg --add-architecture armel
            sudo apt update
            sudo apt install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi libssl-dev:armel
            CROSS_TOOL="arm-linux-gnueabi-"
          fi

          echo "CROSS_TOOL=${CROSS_TOOL}" >> $GITHUB_ENV

      - name: Build Package
        run: |
          EXTRA_ARGS=""
          if [ ! -z "${CROSS_TOOL}" ]; then
            EXTRA_ARGS="--cross-tool ${CROSS_TOOL}"
            echo "Building with cross-tool: ${CROSS_TOOL}"
          fi
          # The build-pkg.sh will find our local smartdns-webui folder
          sh ./package/build-pkg.sh --platform ${{ github.event.inputs.platform }} --arch ${{ github.event.inputs.arch }} --with-ui --static $EXTRA_ARGS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartdns-custom-${{ github.event.inputs.platform }}-${{ github.event.inputs.arch }}
          path: |
            package/*.tar.gz
            package/*.deb
            package/*.ipk

      - name: Publish to GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-build-${{ github.event.inputs.platform }}-${{ github.event.inputs.arch }}
          name: Custom Build (${{ github.event.inputs.platform }} - ${{ github.event.inputs.arch }})
          body: |
            Custom SmartDNS build with WebUI.
            - WebUI Repo: `${{ github.event.inputs.ui_repo }}`
            - WebUI Branch: `${{ github.event.inputs.ui_branch }}`
            - Target Platform: `${{ github.event.inputs.platform }}`
            - Target Arch: `${{ github.event.inputs.arch }}`
            - Build Run: [View Action Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            package/*.tar.gz
            package/*.deb
            package/*.ipk
          generate_release_notes: false
          make_latest: false
